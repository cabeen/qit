name: Deploy Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docsite/**'
      - 'src/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build QIT
        run: ant build

      - name: Generate module library
        run: dist/bin/qit --markdown-all > docsite/docs/library.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs

      - name: Build site
        run: mkdocs build
        working-directory: docsite

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docsite/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
